<!DOCTYPE html>
<html>
<head>
  <!-- Replaced at build time by `flutter build web --base-href /<repo-name>/` -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Service provider portfolios for Campus Stay Ghana students.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Campus Stay Services">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Campus Stay Services</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #f7f7fb; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
              font-family: system-ui, sans-serif; color: #4f46e5; }
    #splash div { width: 36px; height: 36px; border: 4px solid #c7d2fe; border-top-color: #4f46e5;
                  border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Shown while Flutter downloads; Flutter removes it on first frame -->
  <div id="splash"><div></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash'); if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
