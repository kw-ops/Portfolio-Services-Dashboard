<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="psd-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Dashboard Card Base -->
  <rect width="512" height="512" rx="120" fill="#0F172A"/>
  
  <!-- Outer Connection Ring (Campus Stay Integration) -->
  <path d="M 160 160 H 290 A 70 70 0 0 1 290 300 H 220" fill="none" stroke="url(#psd-gradient)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Inner Service Flow Loop (PSD Request Engine) -->
  <path d="M 350 352 H 220 A 70 70 0 0 1 220 212 H 290" fill="none" stroke="#8B5CF6" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Central Sync Nodes -->
  <circle cx="160" cy="160" r="22" fill="#6366F1"/>
  <circle cx="350" cy="352" r="22" fill="#8B5CF6"/>
</svg>
